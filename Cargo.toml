[package]
name = "time-format"
version = "1.2.2"
edition = "2018"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "Unix timestamp and date formatting with strftime, ISO 8601, and RFC 3339 support in UTC and local time"
keywords = ["time", "strftime", "timestamp", "iso8601", "rfc3339"]
categories = ["date-and-time", "internationalization", "no-std"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-time-format"
repository = "https://github.com/jedisct1/rust-time-format"
documentation = "https://docs.rs/time-format"
readme = "README.md"

[badges]
maintenance = { status = "actively-maintained" }

[features]
default = []
bench = []

[dependencies]
# No external dependencies!

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
